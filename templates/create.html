{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="TemplateMo">
  <link
    href="https://fonts.googleapis.com/css?family=Roboto:100,100i,300,300i,400,400i,500,500i,700,700i,900,900i&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <title>Create Blog</title>

  <!-- Bootstrap core CSS -->
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">


  <!-- Additional CSS Files -->
  <link rel="stylesheet" href="{% static 'assets/css/fontawesome.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/templatemo-stand-blog.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/owl.css' %}">
  <style>
    form {
      margin-top: 200px;
      width: 50%;
    }

    h3 {
      color: #f26522;
      font-weight: 500;
      font-size: 30px;
      margin-bottom: 20px;
    }

    .btn {
      margin-top: 30px;
      background: linear-gradient(135deg, #f26522, #ff8c42);
      width: 100%;
      color: #fff;
      font-size: 20px;
      padding: 5px;
      border: none;
    }

    .btn:hover {
      background: transparent;
      color: #f26522;
      border: 2px solid #f26522;
    }

    a {
      text-decoration: none;
      color: #386cbb;
    }

    a:hover {
      color: rgb(237, 63, 63);
      letter-spacing: 1px;
    }

    @media screen and (max-width:600px) {
      form {
        width: 100%;
      }
    }
  </style>
</head>

<body style="background-color: #061121; color: #e2e8f0;">

  {% include 'header.html' %}

  <!-- Page Content -->

  <div class="container">
    <div class="d-flex justify-content-center align-items-center " style="height: 100vh;">

      <form action="{% url 'create' %}" class="p-5 shadow" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <h3 class="mt-4 mb-4">Create Blog</h3>
        <label for="" class="form-label">Title</label>
        <div class="input-group">
          <input type="text" class="form-control" name="postname" required>
        </div>
        <label for="" class="form-label">Content</label>
        <textarea class="form-control" name="content" required></textarea>
        <label for="" class="form-label">Category</label>
        <input type="text" class="form-control" name="category" required>
        <label for="" class="form-label">Upload Image</label>
        <input type="file" class="form-control" name="image">
        <button class="btn">Create Blog</button>
        <br>
        {% for message in messages %}
        <p class="text-danger">{{message}}</p>
        {% endfor %}
      </form>

    </div>
  </div>

  {% include 'footer.html' %}

  <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'assets/js/custom.js' %}"></script>
  <script>
    setTimeout(function() {
      var preloader = document.getElementById('preloader');
      if (preloader) { preloader.style.display = 'none'; }
    }, 800);
  </script>

</body>

</html>
