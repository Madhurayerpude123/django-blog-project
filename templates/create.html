{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Create Your Story | TECHSpot</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assets/css/fontawesome.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/templatemo-stand-blog.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/styles.css' %}">

  <style>
    body { 
      background-color: #061121; 
      color: #e2e8f0; 
      font-family: 'Inter', sans-serif; 
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background accent */
    .bg-accent {
      position: fixed;
      top: 10%; right: -5%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(242,101,34,0.1) 0%, transparent 70%);
      z-index: -1;
    }

    /* Page Heading */
    .create-header {
      padding-top: 140px;
      padding-bottom: 40px;
      text-align: center;
      animation: fadeInDown 0.8s ease-out;
    }

    .create-header h2 {
      font-weight: 800;
      font-size: 2.5rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .create-header h2 span { color: #f26522; }

    /* Glassmorphism Card */
    .glass-form-card {
      background: rgba(10, 25, 47, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(242,101,34,0.2);
      border-radius: 24px;
      padding: 50px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 1s ease-out;
      margin-bottom: 100px;
    }

    /* Styled Inputs */
    .form-group { position: relative; margin-bottom: 30px; }
    
    .form-label {
      color: #f26522;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: block;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 12px !important;
      color: #fff !important;
      padding: 12px 18px !important;
      transition: all 0.3s ease !important;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: #f26522 !important;
      box-shadow: 0 0 0 4px rgba(242,101,34,0.15) !important;
      outline: none;
    }

    textarea.form-control { min-height: 200px; resize: none; }

    /* Image Preview */
    .image-preview-wrapper {
      width: 100%;
      height: 200px;
      border: 2px dashed rgba(242,101,34,0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 10px;
      position: relative;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.3s ease;
    }

    #image-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .upload-placeholder {
      text-align: center;
      color: #64748b;
    }

    .upload-placeholder i { font-size: 2rem; color: #f26522; margin-bottom: 10px; }

    /* Submit Button */
    .btn-submit {
      background: linear-gradient(135deg, #f26522, #e55314);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 20px rgba(242,101,34,0.3);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(242,101,34,0.5);
      background: linear-gradient(135deg, #ff8c42, #f26522);
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Helper text */
    .text-danger { font-size: 0.9rem; font-weight: 500; margin-top: 10px; }

  </style>
</head>

<body>
  <div class="bg-accent"></div>

  {% include 'header.html' %}

  <div class="create-header">
    <div class="container">
      <h2>Create <span>New Story</span></h2>
      <p style="color: #94a3b8;">Share your tech insights with the world</p>
    </div>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="glass-form-card">
          <form action="{% url 'create' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row">
              <!-- Title -->
              <div class="col-md-12">
                <div class="form-group">
                  <label class="form-label">Blog Title</label>
                  <input type="text" class="form-control" name="postname" placeholder="Enter a catchy title..." required>
                </div>
              </div>

              <!-- Category -->
              <div class="col-md-12">
                <div class="form-group">
                  <label class="form-label">Category</label>
                  <input type="text" class="form-control" name="category" list="category-options" placeholder="Type or select a category..." required>
                  <datalist id="category-options">
                    <option value="Artificial Intelligence">
                    <option value="Internet of Things">
                    <option value="Blockchain">
                    <option value="Software Testing">
                    <option value="Telecommunication">
                    <option value="Quantum Computing">
                    <option value="Robotics">
                    <option value="Cyber Security">
                  </datalist>
                </div>
              </div>

              <!-- Image Upload -->
              <div class="col-md-12">
                <div class="form-group">
                  <label class="form-label">Header Image</label>
                  <input type="file" class="form-control" name="image" id="image-input" accept="image/*" required>
                  <div class="image-preview-wrapper" id="preview-container">
                    <img id="image-preview" src="#" alt="Preview">
                    <div class="upload-placeholder" id="placeholder">
                      <i class="fa fa-cloud-upload-alt"></i>
                      <p>Image preview will appear here</p>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Content -->
              <div class="col-md-12">
                <div class="form-group">
                  <label class="form-label">Blog Content</label>
                  <textarea class="form-control" name="content" placeholder="Write your masterpiece here..." required></textarea>
                </div>
              </div>

              <!-- Submit -->
              <div class="col-md-12">
                <button type="submit" class="btn-submit">
                  <i class="fa fa-paper-plane me-2"></i> Publish Story
                </button>
              </div>

              {% for message in messages %}
                <div class="col-12">
                  <p class="text-danger text-center">{{message}}</p>
                </div>
              {% endfor %}

            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  {% include 'footer.html' %}

  <!-- Scripts -->
  <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Image Preview Logic
    document.getElementById('image-input').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        const preview = document.getElementById('image-preview');
        const placeholder = document.getElementById('placeholder');
        const container = document.getElementById('preview-container');

        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
          placeholder.style.display = 'none';
          container.style.borderStyle = 'solid';
          container.style.borderColor = '#f26522';
        }
        reader.readAsDataURL(file);
      }
    });

    // Fade out preloader
    setTimeout(function() {
      var preloader = document.getElementById('preloader');
      if (preloader) { preloader.style.display = 'none'; }
    }, 800);
  </script>
</body>
</html>
