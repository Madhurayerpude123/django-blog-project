<style>
  /* ===== NAVBAR BASE ===== */
  .main-navbar {
    background-color: #0A192F !important;
    padding: 12px 0;
    box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    position: sticky;
    top: 0;
    z-index: 1000;

  .navbar-brand h2 {

    margin: 0;
    letter-spacing: -0.5px;
  }

  .navbar-brand h2 span {
    color: #f26522;
  }

  /* ===== NAV LINKS ===== */
  .navbar-nav .nav-link {
    color: #f26522 !important;
    position: relative;
    transition: all 0.3s ease-in-out;

    border-radius: 6px;

  .navbar-nav .nav-link:hover {

    .navbar-nav .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 4px;
      left: 50%;
      background-color: #f26522;
      transition: all 0.3s ease-in-out;
      transform: translateX(-50%);
      border-radius: 2px;
    }
    .navbar-nav .nav-link:hover::after {
      width: 60%;
    }
  }

  /* ===== HAMBURGER ICON ===== */
  .navbar-toggler {
    border: 2px solid #f26522 !important;
    border-radius: 8px;
    padding: 6px 10px;
    background: transparent !important;

  }

  }

  /* Custom hamburger lines */
  .navbar-toggler-icon {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23f26522' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
  }

  /* ===== MOBILE MENU ===== */
  @media (max-width: 991px) {
    .navbar-collapse {
      background-color: #0A192F;
      border-top: 1px solid rgba(242,101,34,0.2);
      margin-top: 10px;
      border-radius: 0 0 12px 12px;
      padding: 10px 0 16px;
    }

    }

    .navbar-nav .nav-link {
      margin: 4px 16px;
      display: block;
    }

    .navbar-nav .nav-link:hover {
      transform: none;
    }
  }

<script>
  function toggleNavbar() {
    var nav = document.getElementById("navbarResponsive");
    if (nav.classList.contains("show")) {
      nav.classList.remove("show");
    } else {
      nav.classList.add("show");
    }
  }
</script>

<!-- AJAX Like Handler -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.body.addEventListener('submit', function(e) {
    if (e.target && e.target.classList.contains('like-form')) {
      e.preventDefault();
      const form = e.target;
      const url = form.action;
      const formData = new FormData(form);
      
      fetch(url, {
        method: 'POST',
        body: formData,
        headers: {
          'X-Requested-With': 'XMLHttpRequest',
          'X-CSRFToken': formData.get('csrfmiddlewaretoken')
        }
      })
      .then(response => response.json())
      .then(data => {
        const button = form.querySelector('button');
        const countSpan = button.querySelector('.like-count');
        const icon = button.querySelector('i');
        
        // Update the count specifically
        if (countSpan) {
            countSpan.textContent = data.likes;
        }
        
        // Visual feedback
        icon.style.transition = 'transform 0.2s ease';
        icon.style.transform = 'scale(1.8)';
        setTimeout(() => {
          icon.style.transform = 'scale(1)';
        }, 200);
      })
      .catch(error => console.error('Error:', error));
    }
  });
});
</script>
