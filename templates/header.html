<style>
  .navbar-nav .nav-link {
    color: #f26522 !important;
    position: relative;
    transition: all 0.3s ease-in-out;
    font-weight: 600;
    margin: 0 5px;
  }
  
  /* Hover scale animation */
  .navbar-nav .nav-link:hover {
    color: #ff8c42 !important;
    transform: translateY(-2px);
  }

  /* Underline animation */
  .navbar-nav .nav-link::after {
    content: '';
    position: absolute;
    width: 0;
    height: 2px;
    bottom: 2px;
    left: 50%;
    background-color: #ff8c42;
    transition: all 0.3s ease-in-out;
    transform: translateX(-50%);
  }

  .navbar-nav .nav-link:hover::after {
    width: 80%;
  }
</style>

<!-- Header -->
<header class="">
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0A192F;">
    <div class="container">
      <a class="navbar-brand" href="{% url 'index' %}">
        <h2 style="color: #ffffff;">Blog<span style="color: #f26522;">Spot</span></h2>
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"
        aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ml-auto">
          <li>
            <a class="nav-link" href="{% url 'index' %}">Home
              <span class="sr-only">(current)</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'blog' %}">Blogs</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'contact' %}">Contact</a>
          </li>

          {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'create' %}">Create</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'profile' user.id %}">Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" style="color: #f26522 !important; font-weight: bold;" href="{% url 'logout' %}">Logout</a>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'signin' %}"><i class="fa fa-user"></i></a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
