{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Update Post | TECHSpot</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assets/css/fontawesome.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/templatemo-stand-blog.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/styles.css' %}">

  <style>
    body { 
      background-color: #061121; 
      color: #e2e8f0; 
      font-family: 'Inter', sans-serif; 
      min-height: 100vh;
    }

    /* Page Heading */
    .edit-header {
      padding-top: 140px;
      padding-bottom: 40px;
      text-align: center;
      animation: fadeInDown 0.8s ease-out;
    }

    .edit-header h2 {
      font-weight: 800;
      font-size: 2.5rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .edit-header h2 span { color: #f26522; }

    /* Glassmorphism Card */
    .glass-form-card {
      background: rgba(10, 25, 47, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(242,101,34,0.2);
      border-radius: 24px;
      padding: 50px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 1s ease-out;
      margin-bottom: 100px;
    }

    .form-label {
      color: #f26522;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: block;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 12px !important;
      color: #fff !important;
      padding: 12px 18px !important;
      transition: all 0.3s ease !important;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: #f26522 !important;
      box-shadow: 0 0 0 4px rgba(242,101,34,0.15) !important;
    }

    textarea.form-control { min-height: 250px; resize: none; }

    .btn-submit {
      background: linear-gradient(135deg, #f26522, #e55314);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 20px rgba(242,101,34,0.3);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(242,101,34,0.5);
      background: linear-gradient(135deg, #ff8c42, #f26522);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>

<body>

  {% include 'header.html' %}

  <div class="edit-header">
    <div class="container">
      <h2>Update <span>Your Story</span></h2>
    </div>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="glass-form-card">
          <form action="{% url 'editpost' post.id %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row">
              <!-- Title -->
              <div class="col-md-12 mb-4">
                <label class="form-label">Blog Title</label>
                <input type="text" class="form-control" name="postname" value="{{post.postname}}" required>
              </div>

              <!-- Category -->
              <div class="col-md-12 mb-4">
                <label class="form-label">Category</label>
                <input type="text" class="form-control" name="category" list="category-options" value="{{post.category}}" required>
                <datalist id="category-options">
                  <option value="Artificial Intelligence">
                  <option value="Internet of Things">
                  <option value="Blockchain">
                  <option value="Software Testing">
                  <option value="Telecommunication">
                  <option value="Quantum Computing">
                </datalist>
              </div>

              <!-- Content -->
              <div class="col-md-12 mb-4">
                <label class="form-label">Blog Content</label>
                <textarea class="form-control" name="content" required>{{post.content}}</textarea>
              </div>

              <!-- Submit -->
              <div class="col-md-12">
                <button type="submit" class="btn-submit">
                  <i class="fa fa-save me-2"></i> Update Post
                </button>
              </div>

              {% for message in messages %}
                <div class="col-12 mt-3">
                  <p class="text-danger text-center">{{message}}</p>
                </div>
              {% endfor %}

            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  {% include 'footer.html' %}

  <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
